[project]
name = "gedh-backend"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["alembic/versions"]  # міграції генерує Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert у тестах

[tool.ruff.lint.flake8-bugbear]
# Depends / Query / Form / File у значеннях за замовчуванням — штатний спосіб FastAPI
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form", "fastapi.File", "app.core.deps.require"]

[tool.ruff.lint.per-file-ignores]
# «!disabled» / «!» — навмисно непридатні значення password_hash, а не паролі; random — для синтетики, не для криптографії
"tests/*" = ["S105", "S106"]
"app/seed/*" = ["S105", "S106", "S311"]
