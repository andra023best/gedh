# Render Blueprint: backend GEDH на безкоштовному тарифі у Франкфурті (D-30, DG-27).
services:
  - type: web
    name: gedh-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false # вводиться вручну в панелі Render (рядок підключення Neon)
      - key: DIAG_ENABLED
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_BASE_URL
        sync: false # адреса сайту на Vercel
      - key: GEDH_PROXY_SECRET
        sync: false # той самий секрет, що й у Vercel (SQ-05, S-08)
      - key: JWT_SECRET
        generateValue: true # Render генерує випадкове значення сам; ніде не записується (NFR-20)
      - key: DEMO_PASSWORD
        sync: false # пароль демо-облікових записів *@demo.gedh.invalid (вводиться в панелі Render)
      - key: BREVO_API_KEY
        sync: false # ключ API Brevo для листів (S-18)
      - key: MAIL_FROM
        sync: false # адреса відправника, підтверджена в Brevo
      - key: JOB_TOKEN
        sync: false # секрет службових задач; те саме значення — у GitHub Secrets (S-22)
