      operationId: publishVersion
      x-roles: [DG_OFFICER]
      x-fr: [FR-23]
      x-uc: [UC-13]
      x-dg: [DG-06, DG-16]
      x-audit: DATASET_PUBLISH
      responses:
        "200":
          description: Опубліковано
