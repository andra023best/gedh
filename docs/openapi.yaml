      operationId: getCoverage
      security: []
      x-roles: [GUEST]
      x-priority: Should
      x-fr: [FR-06, FR-07]
      x-uc: [UC-04]
      responses:
        "200":
          description: Країни з кількістю показників
          content:
            application/json:
              schema:
                type: array
