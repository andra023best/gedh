                    country: { type: string }
                    indicators: { type: integer }

  # ================================================================ data
  /datasets/{id}/observations:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [data]
      summary: Значення набору (перегляд) з перевіркою доступу
      description: |
        Перевірка доступу (UC-16) на **кожному** запиті:
        - відкритий набір — активний обліковий запис;
        - закритий — чинний дозвіл на країну × категорію × період (`AccessGrant.covers`), або власник-постачальник,
          або DG-офіцер для версії на перевірці.
        Якщо дозвіл покриває лише частину періоду, повертається покрита частина і `coverage: PARTIAL` (UC-16 AC1).
      operationId: getObservations
      x-roles: [ANALYST, ORG_REPRESENTATIVE, DATA_PROVIDER, ADMIN, DG_OFFICER]
      x-fr: [FR-26, FR-27]
      x-uc: [UC-16]
      x-dg: [DG-03, DG-05]
      x-audit: DATA_VIEW (результат SUCCESS або DENIED)
      parameters:
        - $ref: "#/components/parameters/PeriodFrom"
        - $ref: "#/components/parameters/PeriodTo"
        - { name: countries, in: query, description: "Лише для відкритих наборів, через кому", schema: { type: string } }
        - { name: version, in: query, description: "Номер версії (за замовчуванням — чинна)", schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Значення
          content: { application/json: { schema: { $ref: "#/components/schemas/ObservationsResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /datasets/{id}/export:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [data]
      summary: Вивантажити дані у CSV або JSON
      description: |
        Та сама перевірка доступу, що й для перегляду (UC-16). Файл містить метадані (джерело, версія, дата),
        для закритих наборів — ідентифікатор дозволу й позначку «СИНТЕТИЧНІ ДАНІ» (FR-27, DG-04).
        SHA-256 файлу — у заголовку `X-Content-SHA256` і в журналі аудиту (FR-11).
        CSV: значення, що починаються з `= + - @`, екрануються (захист від CSV injection).
      operationId: exportDataset
      x-roles: [ANALYST, ORG_REPRESENTATIVE, DATA_PROVIDER, ADMIN, DG_OFFICER]
      x-fr: [FR-11, FR-26, FR-27]
      x-uc: [UC-07, UC-16]
      x-dg: [DG-04, DG-05]
      x-audit: DATA_DOWNLOAD (хеш файлу, id дозволу)
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, json] }
        - $ref: "#/components/parameters/PeriodFrom"
        - $ref: "#/components/parameters/PeriodTo"
        - { name: countries, in: query, schema: { type: string } }
      responses:
        "200":
          description: "Файл (`Content-Disposition: attachment`)"
          headers:
            X-Content-SHA256: { description: "SHA-256 тіла відповіді", schema: { type: string } }
            X-Grant-Id: { description: "Дозвіл, за яким видано закриті дані", schema: { type: string, format: uuid } }
            X-Coverage: { description: "FULL або PARTIAL", schema: { type: string } }
          content:
            text/csv: { schema: { type: string } }
            application/json: { schema: { $ref: "#/components/schemas/ExportFile" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ================================================================ uploads
  /templates/upload.csv:
    get:
