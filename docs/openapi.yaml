  /provider/uploads:
    post:
      tags: [uploads]
      summary: Завантажити закритий набір (нову версію)
      description: |
        Країна береться з організації постачальника. Без першоджерела файл не приймається (Q-11, DG-06).
        Система: SHA-256 → карантин → перевірка якості Q-01 – Q-11 (UC-18) → DQ-звіт.
        - критичні порушення → версія `REJECTED` (201 з DQ-звітом, UC-12 EX2);
        - лише попередження → `QUARANTINE`, потрібне підтвердження (`/confirm-warnings`);
        - без порушень → `PENDING_REVIEW` (черга DG-офіцера).
      operationId: uploadDataset
      x-roles: [DATA_PROVIDER]
      x-fr: [FR-21, FR-22]
      x-uc: [UC-12, UC-18]
      x-dg: [DG-06, DG-20, DG-21]
      x-audit: DATASET_UPLOAD (хеш файлу)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/UploadForm" }
      responses:
        "201":
          description: Версію створено; статус і DQ-звіт у відповіді
          content: { application/json: { schema: { $ref: "#/components/schemas/DatasetVersion" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`DUPLICATE_FILE` — файл з таким SHA-256 уже завантажено (UC-12 EX3)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413": { $ref: "#/components/responses/FileTooLarge" }
        "415":
          description: "`UNSUPPORTED_FILE_TYPE` — не CSV чи JSON"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`SOURCE_REQUIRED` (UC-12 EX1) або помилки полів форми"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /dataset-versions/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [uploads]
      summary: Версія набору з першоджерелом і DQ-звітом
      description: Бачать постачальник-власник, DG-офіцер, адміністратор.
      operationId: getDatasetVersion
