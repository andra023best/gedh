            schema: { $ref: "#/components/schemas/ReasonBody" }
      responses:
        "200":
          description: Відхилено, постачальника повідомлено
          content: { application/json: { schema: { $ref: "#/components/schemas/DatasetVersion" } } }
        "409": { $ref: "#/components/responses/InvalidState" }

  # ================================================================ access-requests
  /access-requests:
    get:
      tags: [access-requests]
      summary: Заявки, які мені дозволено бачити
      description: |
        Представник — заявки своєї організації; адміністратор — усі; постачальник — лише заявки на країну
        своєї організації після погодження адміністратором (UC-10 EX2).
      operationId: listAccessRequests
      x-roles: [ORG_REPRESENTATIVE, ADMIN, DATA_PROVIDER]
      x-fr: [FR-18, FR-19, FR-20]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AccessRequestStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Заявки
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AccessRequest" }
    post:
      tags: [access-requests]
      summary: Подати заявку на закриті дані
      description: |
        Лише представник верифікованої організації. Строк ≤ 180 днів. Якщо набору ще немає — заявка
        приймається як запит на дані (UC-08 AC1). Статус `SUBMITTED`, номер вигляду `GEDH-2026-0001`.
      operationId: createAccessRequest
      x-roles: [ORG_REPRESENTATIVE]
      x-fr: [FR-18]
      x-uc: [UC-08]
      x-dg: [DG-03, DG-07, DG-12]
      x-audit: REQUEST_SUBMIT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRequestCreate" }
      responses:
        "201":
          description: Заявку зареєстровано, адміністратора сповіщено
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } }
        "403":
          description: "`ORGANIZATION_NOT_VERIFIED` (UC-08 EX1)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: |
            `DUPLICATE_ACTIVE_REQUEST` — уже є активна заявка на цю комбінацію, поле `existing_id` (UC-08 EX2);
            `DELETION_CONFIRMATION_REQUIRED` — за завершеними дозволами не підтверджено видалення (DG-12, FR-45, Should)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`NO_PROVIDER_FOR_COUNTRY` (UC-08 EX3) або помилки полів"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /access-requests/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [access-requests]
      summary: Заявка з рішеннями й угодою
      operationId: getAccessRequest
      x-roles: [ORG_REPRESENTATIVE, ADMIN, DATA_PROVIDER]
      x-fr: [FR-18, FR-19, FR-20]
      responses:
        "200":
          description: Заявка
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /access-requests/{id}/admin-decision:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [access-requests]
      summary: Перше погодження — адміністратор
      description: |
        `APPROVED` → `PROVIDER_REVIEW`; `REJECTED` (причина обов'язкова) → `REJECTED`;
        `NEEDS_CLARIFICATION` (причина = питання) → `NEEDS_CLARIFICATION`.
        Заборонено, якщо адміністратор — заявник або з організації заявника (D-01, DG-07; також тригер БД).
      operationId: decideAsAdmin
      x-roles: [ADMIN]
      x-fr: [FR-19]
      x-uc: [UC-09]
      x-dg: [DG-07]
      x-audit: REQUEST_DECISION
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED, NEEDS_CLARIFICATION] }
                reason: { type: [string, "null"], maxLength: 2000, description: "Обов'язкова для REJECTED і NEEDS_CLARIFICATION" }
      responses:
        "200":
          description: Рішення зафіксовано
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } }
        "403":
          description: "`SELF_REVIEW_FORBIDDEN`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409": { $ref: "#/components/responses/InvalidState" }
        "422":
          description: "`REASON_REQUIRED`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /access-requests/{id}/clarification:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [access-requests]
      summary: Відповісти на запит уточнення
      description: "`NEEDS_CLARIFICATION` → `SUBMITTED` (UC-09 AC1)."
      operationId: answerAccessRequestClarification
      x-roles: [ORG_REPRESENTATIVE]
      x-uc: [UC-09]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, minLength: 5, maxLength: 2000 }
      responses:
        "200":
          description: Заявку повернуто адміністратору
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } }
        "409": { $ref: "#/components/responses/InvalidState" }

  /access-requests/{id}/provider-decision:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [access-requests]
      summary: Друге погодження — постачальник визначає обсяг
      description: |
        Лише постачальник організації-власника даних запитаної країни.
        `APPROVED` — повний обсяг; `APPROVED_NARROWED` — звужений період і/або строк; `REJECTED` — з причиною.
        Якщо опублікованого набору немає → `AWAITING_DATA` (UC-10 AC1), інакше → `AWAITING_AGREEMENT` (угода сформована).
      operationId: decideAsProvider
      x-roles: [DATA_PROVIDER]
      x-fr: [FR-20]
      x-uc: [UC-10]
      x-dg: [DG-07]
      x-audit: REQUEST_DECISION
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderDecision" }
      responses:
        "200":
          description: Обсяг погоджено або заявку відхилено
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/InvalidState" }
        "422":
          description: "`SCOPE_NOT_NARROWER` — звужений обсяг виходить за межі запитаного; `REASON_REQUIRED`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /access-requests/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [access-requests]
      summary: Скасувати власну заявку (до видачі дозволу)
      operationId: cancelAccessRequest
      x-roles: [ORG_REPRESENTATIVE]
      x-uc: [UC-08, UC-11]
      x-audit: REQUEST_DECISION
      responses:
        "200":
          description: Статус CANCELLED
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } }
        "409": { $ref: "#/components/responses/InvalidState" }

  # ================================================================ agreements & grants
  /access-requests/{id}/agreement:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [agreements]
      summary: Текст угоди з погодженим обсягом
      description: Хеш SHA-256 тексту повертається разом із текстом; клієнт надсилає його під час акцепту.
      operationId: getAgreement
      x-roles: [ORG_REPRESENTATIVE, ADMIN, DATA_PROVIDER]
      x-fr: [FR-24]
      x-uc: [UC-11]
      x-dg: [DG-11]
      responses:
        "200":
          description: Угода
          content: { application/json: { schema: { $ref: "#/components/schemas/Agreement" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /access-requests/{id}/agreement/accept:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [agreements]
      summary: Прийняти угоду й отримати дозвіл
      description: |
        Фіксує акцепт (версія, дата, хеш тексту) і в тій самій транзакції видає дозвіл з атрибутами
        країна, категорія, період, `valid_from`, `valid_to` (≤ 180 днів, також CHECK у БД).
        Пропозиція угоди діє 14 днів (UC-11 EX2).
      operationId: acceptAgreement
      x-roles: [ORG_REPRESENTATIVE]
      x-fr: [FR-24, FR-25]
      x-uc: [UC-11]
      x-dg: [DG-05, DG-11]
      x-audit: AGREEMENT_ACCEPT + GRANT_ISSUE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text_hash]
              properties:
                text_hash:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  description: Хеш тексту, який бачив користувач; має збігатися з чинним
      responses:
        "201":
          description: Дозвіл видано
          content: { application/json: { schema: { $ref: "#/components/schemas/Grant" } } }
        "409":
          description: "`AGREEMENT_TEXT_CHANGED`, `OFFER_EXPIRED` або `INVALID_STATE`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /access-requests/{id}/agreement/decline:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [agreements]
      summary: Відмовитися від угоди
      description: Статус `CANCELLED`, дозвіл не видається (UC-11 EX1).
      operationId: declineAgreement
      x-roles: [ORG_REPRESENTATIVE]
      x-uc: [UC-11]
      x-audit: REQUEST_DECISION
      responses:
        "200":
          description: Скасовано
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequest" } } }
        "409": { $ref: "#/components/responses/InvalidState" }

  /grants:
    get:
      tags: [agreements]
      summary: Дозволи
      description: Користувач — власні; постачальник — на набори своєї організації; DG-офіцер і адміністратор — усі.
      operationId: listGrants
      x-roles: [ORG_REPRESENTATIVE, DATA_PROVIDER, ADMIN, DG_OFFICER]
      x-fr: [FR-25, FR-28]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, SUSPENDED, EXPIRED] }
      responses:
        "200":
          description: Дозволи
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Grant" }

  /grants/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [agreements]
      summary: Дозвіл
      operationId: getGrant
      x-roles: [ORG_REPRESENTATIVE, DATA_PROVIDER, ADMIN, DG_OFFICER]
      x-fr: [FR-25]
      responses:
        "200":
          description: Дозвіл
          content: { application/json: { schema: { $ref: "#/components/schemas/Grant" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================================================================ audit
  /audit/events:
    get:
      tags: [audit]
      summary: Журнал аудиту з фільтрами
      description: |
        Лише DG-офіцер; адміністратор отримує 403, і спробу записано (UC-15 EX1).
        Сам перегляд журналу теж записується (`AUDIT_VIEW`). Пагінація — від нових до старих за `before_seq`.
      operationId: listAuditEvents
      x-roles: [DG_OFFICER]
      x-fr: [FR-31]
      x-uc: [UC-15]
      x-dg: [DG-17, DG-18]
      x-audit: AUDIT_VIEW
      parameters:
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: organization_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { $ref: "#/components/schemas/AuditAction" } }
        - { name: object_type, in: query, schema: { type: string } }
        - { name: object_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: before_seq, in: query, schema: { type: integer, minimum: 1 } }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Записи
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  next_before_seq: { type: [integer, "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }

  /audit/events/{seq}:
    parameters:
      - name: seq
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [audit]
      summary: Запис журналу з деталями й хешами
      operationId: getAuditEvent
      x-roles: [DG_OFFICER]
      x-fr: [FR-31]
      x-uc: [UC-15]
      x-audit: AUDIT_VIEW
      responses:
        "200":
          description: Запис
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditEvent" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================================================================ internal jobs
  /internal/jobs/import:
    post:
      tags: [internal]
      summary: Імпорт відкритих даних з API джерел (щотижня)
      description: |
        Запускає увімкнені конектори у фоні й одразу повертає 202 (імпорт довший за тайм-аут проксі).
        Параметр `indicator` — лише один показник. UC-14; S-22.
      operationId: jobImport
      security:
        - jobToken: []
      x-roles: [SYSTEM]
      x-priority: Should
      x-fr: [FR-14, FR-15, FR-16]
      x-uc: [UC-14, UC-18]
      x-dg: [DG-16, DG-22]
      x-audit: DATASET_PUBLISH (для кожного запуску конектора)
      parameters:
        - { name: indicator, in: query, schema: { type: string } }
      responses:
        "202":
          description: Імпорт запущено
          content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } }
        "401":
          description: "`JOB_TOKEN_INVALID`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /internal/jobs/expire-grants:
    post:
      tags: [internal]
      summary: Завершити прострочені дозволи (щодня)
      description: |
        Викликає GitHub Actions cron із заголовком `X-Job-Token` (секрет у GitHub Secrets і на Render).
        Дозволи з `valid_to < now` → `EXPIRED`; заявнику — запит підтвердити видалення даних (DG-12).
        Ідемпотентно. Додатково `covers()` перевіряє строк на кожному зверненні, тож доступ припиняється
        вчасно навіть якщо cron не спрацював (DG-05).
      operationId: jobExpireGrants
      security:
        - jobToken: []
      x-roles: [SYSTEM]
      x-fr: [FR-28]
      x-uc: [UC-19]
      x-dg: [DG-05, DG-08, DG-12]
      x-audit: GRANT_EXPIRE (для кожного дозволу)
      responses:
        "200":
          description: Скільки дозволів завершено
          content:
            application/json:
              schema:
                type: object
                required: [expired]
                properties:
                  expired: { type: integer, minimum: 0 }
        "401":
          description: "`JOB_TOKEN_INVALID`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен доступу, 15 хв
    refreshCookie:
      type: apiKey
      in: cookie
      name: gedh_refresh
      description: Токен оновлення, 7 днів, HttpOnly, Path=/api/auth
    jobToken:
      type: apiKey
      in: header
      name: X-Job-Token
      description: Секрет службових задач (GitHub Actions)

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PathToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 32 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    PeriodFrom:
      name: period_from
      in: query
      schema: { type: string, format: date }
    PeriodTo:
      name: period_to
      in: query
      schema: { type: string, format: date }
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: "`NOT_AUTHENTICATED`, `TOKEN_EXPIRED` або `ACCOUNT_NOT_ACTIVE` (статус перевіряється на кожному запиті)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: "`FORBIDDEN_ROLE` — роль не дозволяє дію; спроба записується в журнал аудиту"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    AccessDenied:
      description: "`ACCESS_DENIED` (немає дозволу), `GRANT_EXPIRED`, `GRANT_SUSPENDED` — запис DENIED у журнал (UC-16 EX2)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: "`NOT_FOUND`"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InvalidState:
      description: "`INVALID_STATE` — дія недоступна в поточному статусі; поле `status`"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    FileTooLarge:
      description: "`FILE_TOO_LARGE` — набір > 5 МБ або документ > 2 МБ (NFR-19)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: "`RATE_LIMITED` (NFR-18)"
      headers:
        Retry-After: { schema: { type: integer }, description: секунди }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ValidationError:
      description: Помилки полів (формат FastAPI)
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: array
                items:
                  type: object
                  properties:
                    loc: { type: array, items: { type: [string, integer] } }
                    msg: { type: string }
                    type: { type: string }

  schemas:
    # ---------------------------------------------------------------- спільні
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string, description: Стабільний код помилки, example: ACCESS_DENIED }
        message: { type: string, description: Пояснення для розробника (інтерфейс показує переклад коду) }
        status: { type: string, description: "Поточний статус об'єкта (для INVALID_STATE, ACCOUNT_NOT_ACTIVE)" }
        retry_after: { type: integer, description: Секунди (ACCOUNT_LOCKED) }
        existing_id: { type: string, format: uuid, description: Наявна заявка (DUPLICATE_ACTIVE_REQUEST) }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Page:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: {} }
        total: { type: integer, minimum: 0 }
    TokenBody:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32 }
    ReasonBody:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 2000 }
    Period:
      type: object
      description: "Тип даних Period (рис. 5.8), {start ≤ end}"
      required: [start, end]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
    Health:
      type: object
      required: [status, version, env, started_at, uptime_s, db]
      properties:
        status: { type: string, const: ok }
        version: { type: string }
        env: { type: string }
        started_at: { type: string, format: date-time }
        uptime_s: { type: integer }
        db:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [ok, not_configured, error] }
            latency_ms: { type: integer }
            server_version: { type: string }

    # ---------------------------------------------------------------- переліки (рис. 5.8)
    Role:
      type: string
      enum: [ANALYST, ORG_REPRESENTATIVE, DATA_PROVIDER, ADMIN, DG_OFFICER]
    AccountStatus:
      type: string
      enum: [PENDING_EMAIL, PENDING_REVIEW, ACTIVE, REJECTED, DEACTIVATED, ANONYMIZED]
    ReviewStatus:
      type: string
      enum: [PENDING, NEEDS_CLARIFICATION, APPROVED, REJECTED]
    Classification:
      type: string
      enum: [PUBLIC, OPEN, RESTRICTED, PERSONAL, INTERNAL]
    VersionStatus:
      type: string
      enum: [QUARANTINE, REJECTED, PENDING_REVIEW, PUBLISHED, SUPERSEDED]
    AccessRequestStatus:
      type: string
      enum: [SUBMITTED, NEEDS_CLARIFICATION, PROVIDER_REVIEW, AWAITING_DATA, AWAITING_AGREEMENT, GRANTED,
             REJECTED, CANCELLED, EXPIRED]
    AuditAction:
      type: string
      enum: [LOGIN, LOGIN_FAILED, CONSENT_CHANGE, REGISTRATION_DECISION, ROLE_CHANGE, REQUEST_SUBMIT,
             REQUEST_DECISION, AGREEMENT_ACCEPT, GRANT_ISSUE, GRANT_SUSPEND, GRANT_EXPIRE, DATASET_UPLOAD,
             DATASET_PUBLISH, DATA_VIEW, DATA_DOWNLOAD, CONFIG_CHANGE, AUDIT_VIEW, AUDIT_EXPORT,
             PERSONAL_DATA_EXPORT, ACCOUNT_DELETE, RETENTION_PURGE, DATASET_REJECT, DELETION_CONFIRM,
             SECURITY_INCIDENT]

    # ---------------------------------------------------------------- identity
    ConsentText:
      type: object
      required: [text_version, text, published_at]
      properties:
        text_version: { type: string, example: "1.0" }
        text: { type: string, description: "Мета, правова підстава (GDPR ст. 6(1)(b)), строки, права суб'єкта" }
        published_at: { type: string, format: date-time }
    RegistrationForm:
      type: object
      required: [full_name, email, password, country_code, account_type, purpose, consent_accepted, consent_text_version]
      properties:
        full_name: { type: string, minLength: 2, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          description: "NFR-14 — щонайменше 10 символів, обов'язково літери й цифри"
        country_code: { type: string, pattern: "^[A-Z]{3}$" }
        account_type: { type: string, enum: [INDIVIDUAL, ORGANIZATION_MEMBER] }
        organization_id: { type: [string, "null"], format: uuid, description: "Верифікована організація (ORGANIZATION_MEMBER)" }
        organization_name: { type: [string, "null"], maxLength: 200, description: "Якщо організації немає в списку (UC-02 AC2)" }
        position: { type: [string, "null"], maxLength: 200 }
        purpose: { type: string, minLength: 10, maxLength: 2000 }
        consent_accepted: { type: boolean, const: true }
        consent_text_version: { type: string }
        verification_document: { type: string, format: binary, description: "PDF/PNG/JPEG ≤ 2 МБ" }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: bearer }
        expires_in: { type: integer, example: 900 }
        user: { $ref: "#/components/schemas/UserBrief" }
        consent_update_required:
          type: boolean
          description: Прийнята версія згоди застаріла — показати нову (UC-03 AC2)
    UserBrief:
      type: object
      required: [id, full_name, role, status]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/AccountStatus" }
        organization: { oneOf: [{ $ref: "#/components/schemas/OrganizationPublic" }, { type: "null" }] }
    Me:
      allOf:
        - $ref: "#/components/schemas/UserBrief"
        - type: object
          required: [email, country_code, created_at, consent, retention]
          properties:
            email: { type: string, format: email }
            position: { type: [string, "null"] }
            country_code: { type: string }
            created_at: { type: string, format: date-time }
            consent:
              type: object
              required: [accepted_version, current_version, accepted_at]
              properties:
                accepted_version: { type: string }
                current_version: { type: string }
                accepted_at: { type: string, format: date-time }
            retention:
              type: array
              description: Що зберігається, навіщо й скільки (табл. 3.26 звіту)
              items:
                type: object
                required: [data, purpose, retention]
                properties:
                  data: { type: string }
                  purpose: { type: string }
                  retention: { type: string }
    Registration:
      type: object
      required: [id, status, account_type, purpose, submitted_at, applicant]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ReviewStatus" }
        account_type: { type: string, enum: [INDIVIDUAL, ORGANIZATION_MEMBER] }
        purpose: { type: string }
        submitted_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        decision_reason: { type: [string, "null"] }
        has_document: { type: boolean }
        email_domain_matches_organization: { type: [boolean, "null"], description: "FR-04: підказка адміністратору" }
        organization_name: { type: [string, "null"] }
        applicant:
          type: object
          required: [id, full_name, email, country_code, status]
          properties:
            id: { type: string, format: uuid }
            full_name: { type: string }
            email: { type: string, format: email }
            position: { type: [string, "null"] }
            country_code: { type: string }
            status: { $ref: "#/components/schemas/AccountStatus" }
            organization: { oneOf: [{ $ref: "#/components/schemas/OrganizationPublic" }, { type: "null" }] }
    OrganizationPublic:
      type: object
      required: [id, name, type, country_code]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [GOVERNMENT, UNIVERSITY, ANALYTICS_COMPANY] }
        country_code: { type: string }
    Organization:
      allOf:
        - $ref: "#/components/schemas/OrganizationPublic"
        - type: object
          required: [status]
          properties:
            email_domain: { type: [string, "null"] }
            status: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
            verified_at: { type: [string, "null"], format: date-time }
    OrganizationCreate:
      type: object
      required: [name, type, country_code]
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        type: { type: string, enum: [GOVERNMENT, UNIVERSITY, ANALYTICS_COMPANY] }
        country_code: { type: string, pattern: "^[A-Z]{3}$" }
        email_domain: { type: [string, "null"], maxLength: 100, example: stat.example.org }

    # ---------------------------------------------------------------- довідники й каталог
    Country:
      type: object
      required: [code, name_ua, name_en, is_active]
      properties:
        code: { type: string, pattern: "^[A-Z]{3}$" }
        name_ua: { type: string }
        name_en: { type: string }
        is_active: { type: boolean }
    Category:
      type: object
      required: [code, name_ua, name_en]
      properties:
        code: { type: string }
        name_ua: { type: string }
        name_en: { type: string }
    Indicator:
      type: object
      required: [code, name_ua, name_en, definition, unit, scale, frequency]
      properties:
        code: { type: string }
        name_ua: { type: string }
        name_en: { type: string }
        definition: { type: string }
        unit: { type: string }
        scale: { type: string }
        frequency: { type: string, enum: [ANNUAL, QUARTERLY, MONTHLY] }
    DatasetSummary:
      type: object
      required: [id, kind, title_ua, title_en, classification, licence, is_synthetic]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [OPEN, RESTRICTED] }
        title_ua: { type: string }
        title_en: { type: string }
        classification: { $ref: "#/components/schemas/Classification" }
        licence: { type: string }
        is_synthetic: { type: boolean, description: "Позначка «СИНТЕТИЧНІ ДАНІ» (FR-27, DG-04)" }
        source_system: { type: [string, "null"] }
        country_code: { type: [string, "null"] }
        category_code: { type: [string, "null"] }
        owner: { oneOf: [{ $ref: "#/components/schemas/OrganizationPublic" }, { type: "null" }] }
        indicators: { type: array, items: { type: string } }
        current_version_no: { type: [integer, "null"] }
        updated_at: { type: [string, "null"], format: date-time }
    DatasetDetail:
      allOf:
        - $ref: "#/components/schemas/DatasetSummary"
        - type: object
          properties:
            status: { type: [string, "null"], enum: [DRAFT, ACTIVE, WITHDRAWN, null] }
            versions:
              type: array
              items:
                type: object
                required: [id, version_no, status]
                properties:
                  id: { type: string, format: uuid }
                  version_no: { type: integer }
                  status: { $ref: "#/components/schemas/VersionStatus" }
                  published_at: { type: [string, "null"], format: date-time }

    # ---------------------------------------------------------------- дані
    Observation:
      type: object
      required: [country, indicator, period, value]
      properties:
        country: { type: string }
        indicator: { type: string }
        breakdown: { type: [string, "null"] }
        period: { $ref: "#/components/schemas/Period" }
        value: { type: [number, "null"], description: "null = «н/д», без інтерполяції (UC-05 EX1)" }
        note: { type: [string, "null"] }
    ObservationsResponse:
      type: object
      required: [dataset_id, version_no, is_synthetic, coverage, items]
      properties:
        dataset_id: { type: string, format: uuid }
        version_no: { type: integer }
        is_synthetic: { type: boolean }
        coverage: { type: string, enum: [FULL, PARTIAL] }
        covered_period: { oneOf: [{ $ref: "#/components/schemas/Period" }, { type: "null" }] }
        grant_id: { type: [string, "null"], format: uuid }
        source: { $ref: "#/components/schemas/SourceReference" }
        items:
          type: array
          items: { $ref: "#/components/schemas/Observation" }
    ExportFile:
      type: object
      description: JSON-вивантаження — метадані й значення (FR-11, FR-27)
      required: [metadata, observations]
      properties:
        metadata:
          type: object
          required: [dataset_id, title, version_no, generated_at, licence, is_synthetic]
          properties:
            dataset_id: { type: string, format: uuid }
            title: { type: string }
            version_no: { type: integer }
            generated_at: { type: string, format: date-time }
            licence: { type: string }
            source: { type: string }
            is_synthetic: { type: boolean }
            synthetic_notice: { type: [string, "null"], example: "СИНТЕТИЧНІ ДАНІ — не є офіційною статистикою" }
            grant_id: { type: [string, "null"], format: uuid }
            coverage: { type: string, enum: [FULL, PARTIAL] }
        observations:
          type: array
          items: { $ref: "#/components/schemas/Observation" }

    # ---------------------------------------------------------------- завантаження й якість
    SourceReference:
      type: object
      description: Першоджерело (DG-06, Q-11)
      required: [document_title, methodology, responsible_person]
      properties:
        document_title: { type: string, maxLength: 300 }
        document_number: { type: [string, "null"], maxLength: 100 }
        document_date: { type: [string, "null"], format: date }
        url: { type: [string, "null"], format: uri, maxLength: 500 }
        internal_ref: { type: [string, "null"], maxLength: 200 }
        methodology: { type: string }
        responsible_person: { type: string, maxLength: 200 }
    UploadForm:
      type: object
      required: [file, category_code, source_document_title, source_methodology, source_responsible_person]
      properties:
        file: { type: string, format: binary, description: "CSV (UTF-8) або JSON за шаблоном, ≤ 5 МБ" }
        dataset_id: { type: [string, "null"], format: uuid, description: "Нова версія наявного набору; якщо порожньо — новий набір" }
        category_code: { type: string }
        title_ua: { type: [string, "null"], maxLength: 300, description: Обов'язково для нового набору }
        title_en: { type: [string, "null"], maxLength: 300, description: Обов'язково для нового набору }
        source_document_title: { type: string }
        source_document_number: { type: [string, "null"] }
        source_document_date: { type: [string, "null"], format: date }
        source_url: { type: [string, "null"], format: uri }
        source_internal_ref: { type: [string, "null"] }
        source_methodology: { type: string }
        source_responsible_person: { type: string }
    QualityIssue:
      type: object
      required: [rule_code, severity, record_ref, message]
      properties:
        rule_code: { type: string, example: Q-06 }
        severity: { type: string, enum: [CRITICAL, WARNING] }
        record_ref: { type: string, description: "Рядок файлу або ключ запису", example: "row 17" }
        message: { type: string }
    QualityReport:
      type: object
      required: [records_total, critical_count, warning_count, score, issues]
      properties:
        records_total: { type: integer }
        critical_count: { type: integer }
        warning_count: { type: integer }
        score: { type: number, minimum: 0, maximum: 100 }
        warnings_confirmed_at: { type: [string, "null"], format: date-time }
        issues:
          type: array
          items: { $ref: "#/components/schemas/QualityIssue" }
    DatasetVersion:
      type: object
      required: [id, dataset_id, version_no, status, created_at]
      properties:
        id: { type: string, format: uuid }
        dataset_id: { type: string, format: uuid }
        dataset_title_ua: { type: string }
        version_no: { type: integer }
        status: { $ref: "#/components/schemas/VersionStatus" }
        file_hash: { type: [string, "null"], description: SHA-256 }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, "null"], format: date-time }
        rejection_reason: { type: [string, "null"] }
        previous_version_id: { type: [string, "null"], format: uuid }
        source: { oneOf: [{ $ref: "#/components/schemas/SourceReference" }, { type: "null" }] }
        quality_report: { oneOf: [{ $ref: "#/components/schemas/QualityReport" }, { type: "null" }] }

    # ---------------------------------------------------------------- обмін
    AccessRequestCreate:
      type: object
      required: [country_code, category_code, period, purpose, usage_place, requested_term_days, responsible_person]
      properties:
        country_code: { type: string, pattern: "^[A-Z]{3}$" }
        category_code: { type: string }
        period: { $ref: "#/components/schemas/Period" }
        purpose: { type: string, minLength: 10, maxLength: 2000 }
        usage_place: { type: string, minLength: 2, maxLength: 300 }
        requested_term_days: { type: integer, minimum: 1, maximum: 180 }
        responsible_person: { type: string, minLength: 2, maxLength: 200 }
    ApprovalDecision:
      type: object
      required: [stage, decision, decided_at, decided_by]
      properties:
        stage: { type: string, enum: [ADMIN, PROVIDER] }
        decision: { type: string, enum: [APPROVED, APPROVED_NARROWED, REJECTED] }
        reason: { type: [string, "null"] }
        approved_period: { oneOf: [{ $ref: "#/components/schemas/Period" }, { type: "null" }] }
        approved_term_days: { type: [integer, "null"] }
        decided_at: { type: string, format: date-time }
        decided_by: { type: string, description: ПІБ і роль }
    AccessRequest:
      allOf:
        - $ref: "#/components/schemas/AccessRequestCreate"
        - type: object
          required: [id, number, status, submitted_at, requester, organization]
          properties:
            id: { type: string, format: uuid }
            number: { type: string, example: GEDH-2026-0001 }
            status: { $ref: "#/components/schemas/AccessRequestStatus" }
            submitted_at: { type: string, format: date-time }
            requester: { type: string, description: ПІБ заявника }
            organization: { $ref: "#/components/schemas/OrganizationPublic" }
            target_dataset_id: { type: [string, "null"], format: uuid }
            decisions:
              type: array
              maxItems: 2
              items: { $ref: "#/components/schemas/ApprovalDecision" }
            clarification_note: { type: [string, "null"] }
            grant_id: { type: [string, "null"], format: uuid }
    ProviderDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVED, APPROVED_NARROWED, REJECTED] }
        approved_period: { oneOf: [{ $ref: "#/components/schemas/Period" }, { type: "null" }], description: "Для APPROVED_NARROWED — у межах запитаного" }
        approved_term_days: { type: [integer, "null"], minimum: 1, maximum: 180 }
        reason: { type: [string, "null"], maxLength: 2000, description: "Обов'язкова для REJECTED" }
    Agreement:
      type: object
      required: [id, request_id, text_version, text, text_hash, offered_at, offer_expires_at, scope]
      properties:
        id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        text_version: { type: string }
        text: { type: string, description: "Мета, місце використання, заборона передачі третім особам, видалення після строку" }
        text_hash: { type: string, description: SHA-256 тексту }
        offered_at: { type: string, format: date-time }
        offer_expires_at: { type: string, format: date-time, description: "offered_at + 14 днів" }
        accepted_at: { type: [string, "null"], format: date-time }
        scope:
          type: object
          required: [country_code, category_code, period, term_days, dataset_id]
          properties:
            country_code: { type: string }
            category_code: { type: string }
            period: { $ref: "#/components/schemas/Period" }
            term_days: { type: integer, maximum: 180 }
            dataset_id: { type: string, format: uuid }
            narrowed: { type: boolean, description: "Постачальник звузив обсяг (UC-11 AC1)" }
    Grant:
      type: object
      required: [id, dataset_id, country_code, category_code, period, valid_from, valid_to, status]
      properties:
        id: { type: string, format: uuid }
        request_number: { type: string }
        dataset_id: { type: string, format: uuid }
        country_code: { type: string }
        category_code: { type: string }
        period: { $ref: "#/components/schemas/Period" }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, SUSPENDED, EXPIRED] }
        suspension_reason: { type: [string, "null"] }
        deletion_confirmed_at: { type: [string, "null"], format: date-time }
        grantee: { type: string, description: ПІБ }

    # ---------------------------------------------------------------- аудит
    AuditEvent:
      type: object
      required: [seq, occurred_at, action, object_type, object_id, result, request_id, prev_hash, hash]
      properties:
        seq: { type: integer }
        occurred_at: { type: string, format: date-time }
        actor_id: { type: [string, "null"], format: uuid }
        actor_role: { oneOf: [{ $ref: "#/components/schemas/Role" }, { type: "null" }] }
        on_behalf_of_id: { type: [string, "null"], format: uuid }
        action: { $ref: "#/components/schemas/AuditAction" }
        object_type: { type: string }
        object_id: { type: string }
        result: { type: string, enum: [SUCCESS, DENIED, ERROR] }
        request_id: { type: string }
        details: { type: string, description: "JSON без персональних даних і без значень закритих даних (DG-25)" }
        prev_hash: { type: string }
        hash: { type: string, description: "SHA-256(вміст запису + prev_hash)" }
