openapi: 3.1.0
info:
  title: GEDH API — контракт для вимог Must
  version: 0.1.0
  description: |
    Контракт API платформи керованого дата-шерингу GEDH (етап Е1б, рішення S-13).

    **Обсяг.** 21 функціональна вимога Must зі звіту (табл. 3.1) і кілька довідкових маршрутів,
    без яких ці сценарії не працюють (позначено `x-priority: Should`). Решту Should/Could описуємо
    на етапах, де їх реалізуємо.

    **Позначення в кожній операції:**
    - `x-fr`, `x-uc`, `x-dg` — вимоги, прецеденти й правила data governance зі звіту;
    - `x-roles` — ролі, яким дозволено операцію (`GUEST` — без входу). Іншим — 403 `FORBIDDEN_ROLE`;
    - `x-audit` — дія, яку записують у журнал аудиту (UC-17). Якщо запис у журнал не вдався,
      уся операція скасовується (UC-17 EX1).

    **Транспорт.** Усі маршрути мають префікс `/api` і доступні лише через Vercel
    (S-08: прямі запити на Render → 403 `DIRECT_ACCESS_FORBIDDEN`, крім `/api/health`).

    **Автентифікація (Q-04, NFR-14, NFR-15).**
    - Токен доступу JWT (15 хв) — у заголовку `Authorization: Bearer …`, зберігається лише в пам'яті SPA.
    - Токен оновлення (7 днів) — у cookie `gedh_refresh`: `HttpOnly; Secure; SameSite=Lax; Path=/api/auth`.
    - CSRF для `/auth/refresh` і `/auth/logout`: перевірка `Origin` і подвійне подання —
      значення cookie `gedh_csrf` (читається JS) має збігатися із заголовком `X-CSRF-Token`.
    - Статус і роль користувача перевіряються на кожному запиті, тож деактивація діє одразу.

    **Помилки.** Тіло `{"detail": "КОД", "message": "…"}`; код стабільний, текст перекладає інтерфейс
    (NFR-22). Помилки валідації — 422 у форматі FastAPI (`detail` — масив полів).
    Ліміт запитів (NFR-18: 10 спроб входу за хв з IP, 60 запитів за хв на API-ключ) — 429 із заголовком `Retry-After`; IP клієнта береться лише з
    `x-vercel-forwarded-for` (S-07).
  license:
    name: Навчальний проєкт ОІ-34
servers:
  - url: https://gedh.vercel.app/api
    description: публічний сайт (Vercel → Render)
  - url: http://localhost:5173/api
    description: локальна розробка (проксі Vite → uvicorn :8010)

tags:
  - name: service
    description: Службові маршрути
  - name: auth
    description: Реєстрація, підтвердження e-mail, вхід (UC-01, UC-03)
  - name: me
    description: Власний профіль і персональні дані (UC-21)
  - name: admin-registrations
    description: Розгляд заявок на реєстрацію й організації (UC-02)
  - name: reference
    description: Довідники й каталог без значень (UC-04 — допоміжні для Must)
  - name: data
    description: Перегляд і вивантаження даних з перевіркою доступу (UC-07, UC-16)
  - name: uploads
    description: Завантаження закритих наборів і перевірка якості (UC-12, UC-18)
  - name: dg-review
    description: Перевірка першоджерела й публікація DG-офіцером (UC-13)
  - name: access-requests
    description: Заявки на закриті дані й подвійне погодження (UC-08 – UC-10)
  - name: agreements
    description: Угода про обмін даними й дозволи (UC-11, UC-19)
  - name: audit
    description: Журнал аудиту (UC-15)
  - name: internal
    description: Службові задачі за розкладом (GitHub Actions cron)

security:
  - bearer: []

paths:
  # ================================================================ service
  /health:
    get:
      tags: [service]
      summary: Стан API й бази даних
      description: Відкритий маршрут — його викликає Render і інтерфейс, щоб «розбудити» сервер.
      operationId: health
      security: []
      x-roles: [GUEST]
      responses:
        "200":
          description: Стан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  # ================================================================ auth
  /auth/consent:
    get:
      tags: [auth]
      summary: Чинний текст згоди на обробку персональних даних
      operationId: getCurrentConsent
      security: []
      x-roles: [GUEST]
      x-fr: [FR-01]
      x-dg: [DG-09, DG-10]
      responses:
        "200":
          description: Текст і версія
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentText" }

  /auth/register:
    post:
      tags: [auth]
      summary: Зареєструвати обліковий запис
      description: |
        Створює користувача зі статусом `PENDING_EMAIL`, запис згоди (версія тексту, час, IP) і заявку
        на реєстрацію; надсилає лист із посиланням підтвердження (дійсне 24 год).

        **Захист від перебору e-mail (UC-01 EX1):** якщо e-mail уже зареєстровано, відповідь та сама (202),
        а власнику адреси надсилається лист із пропозицією відновити пароль.

        Для типу `ORGANIZATION_MEMBER` потрібен e-mail на домені обраної організації **або** документ
        (PDF, PNG, JPEG ≤ 2 МБ; перевірка за сигнатурою файлу, NFR-19) — UC-01 AC1.
      operationId: register
      security: []
      x-roles: [GUEST]
      x-fr: [FR-01, FR-02, FR-04]
      x-uc: [UC-01]
      x-dg: [DG-09, DG-10]
      x-audit: CONSENT_CHANGE
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/RegistrationForm" }
            encoding:
              verification_document:
                contentType: application/pdf, image/png, image/jpeg
      responses:
        "202":
          description: Прийнято; перевірте пошту
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: "`CONSENT_REQUIRED` — згоду не надано (UC-01 EX2); `CONSENT_VERSION_OUTDATED` — текст згоди змінився"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413": { $ref: "#/components/responses/FileTooLarge" }
        "415":
          description: "`UNSUPPORTED_FILE_TYPE` — документ не PDF / PNG / JPEG"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Підтвердити e-mail за одноразовим токеном з листа
      description: Статус `PENDING_EMAIL` → `PENDING_REVIEW`; заявка потрапляє в чергу адміністратора (FR-02).
      operationId: verifyEmail
      security: []
      x-roles: [GUEST]
      x-fr: [FR-02]
      x-uc: [UC-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenBody" }
      responses:
        "200":
          description: E-mail підтверджено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: "`TOKEN_INVALID` — токен не існує або вже використаний"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "410":
          description: "`TOKEN_EXPIRED` — минуло 24 год (UC-01 EX3); можна надіслати новий лист"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /auth/resend-verification:
    post:
      tags: [auth]
      summary: Надіслати лист підтвердження повторно
      description: Відповідь завжди 202, незалежно від того, чи існує адреса.
      operationId: resendVerification
      security: []
      x-roles: [GUEST]
      x-uc: [UC-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Якщо адреса очікує підтвердження, лист надіслано
          content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/registration-clarification/{token}:
    parameters:
      - $ref: "#/components/parameters/PathToken"
    get:
      tags: [auth]
      summary: Запит адміністратора на уточнення заявки (за посиланням з листа)
      description: Одноразове посилання, дійсне 7 днів; вхід не потрібен (UC-02 AC1).
      operationId: getRegistrationClarification
      security: []
      x-roles: [GUEST]
      x-uc: [UC-02]
      responses:
        "200":
          description: Питання адміністратора
          content:
            application/json:
              schema:
                type: object
                required: [note, expires_at]
                properties:
                  note: { type: string }
                  expires_at: { type: string, format: date-time }
        "410":
          description: "`TOKEN_EXPIRED`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    post:
      tags: [auth]
      summary: Відповісти на уточнення
      description: Заявка повертається в чергу адміністратора (`NEEDS_CLARIFICATION` → `PENDING`).
      operationId: answerRegistrationClarification
      security: []
      x-roles: [GUEST]
      x-uc: [UC-02]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, maxLength: 2000 }
                verification_document: { type: string, format: binary, description: "PDF/PNG/JPEG ≤ 2 МБ" }
      responses:
        "200":
          description: Відповідь прийнято
          content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } }
        "410":
          description: "`TOKEN_EXPIRED`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /auth/login:
    post:
      tags: [auth]
      summary: Увійти за e-mail і паролем
      description: |
        Повертає токен доступу; токен оновлення — у cookie `gedh_refresh`, CSRF-значення — у cookie `gedh_csrf`.
        Повідомлення про помилку однакове для невірного e-mail і пароля (UC-03 EX1).
        Після 5 невдалих спроб вхід блокується на 15 хв (лічильник у БД, `User.failedLoginCount`).
      operationId: login
      security: []
      x-roles: [GUEST]
      x-fr: [FR-05]
      x-uc: [UC-03]
      x-audit: LOGIN / LOGIN_FAILED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Вхід виконано
          headers:
            Set-Cookie:
              description: "`gedh_refresh` (HttpOnly) і `gedh_csrf`"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401":
          description: "`INVALID_CREDENTIALS`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: "`ACCOUNT_NOT_ACTIVE` — обліковий запис очікує підтвердження чи розгляду, відхилений або деактивований; поле `status` (UC-03 EX2)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "423":
          description: "`ACCOUNT_LOCKED` — забагато спроб; `retry_after` у секундах"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Оновити токен доступу
      description: Ротація токена оновлення — старий відкликається (Session.revokedAt). Потрібен `X-CSRF-Token`.
      operationId: refresh
      security:
        - refreshCookie: []
      x-roles: [ANALYST, ORG_REPRESENTATIVE, DATA_PROVIDER, ADMIN, DG_OFFICER]
      x-fr: [FR-05]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Новий токен доступу
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401":
          description: "`SESSION_EXPIRED` або `SESSION_REVOKED`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: "`CSRF_FAILED`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /auth/logout:
    post:
      tags: [auth]
      summary: Вийти (відкликати сесію)
      operationId: logout
      security:
        - refreshCookie: []
      x-roles: [ANALYST, ORG_REPRESENTATIVE, DATA_PROVIDER, ADMIN, DG_OFFICER]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Сесію відкликано, cookie видалено

  # ================================================================ me
  /me:
    get:
      tags: [me]
      summary: Мій профіль і що про мене зберігається
      description: Дані, мета й терміни зберігання (табл. 3.26), прийнята версія згоди, організація (UC-21 крок 2).
      operationId: getMe
      x-roles: [ANALYST, ORG_REPRESENTATIVE, DATA_PROVIDER, ADMIN, DG_OFFICER]
      x-fr: [FR-34]
      x-uc: [UC-21]
      responses:
        "200":
          description: Профіль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      summary: Виправити власні персональні дані
      description: Лише ПІБ і посада. Зміну організації описано на пізнішому етапі (UC-21 крок 4, DG-12).
      operationId: updateMe
      x-roles: [ANALYST, ORG_REPRESENTATIVE, DATA_PROVIDER, ADMIN, DG_OFFICER]
      x-fr: [FR-34]
      x-uc: [UC-21]
      x-audit: CONFIG_CHANGE (старе й нове значення без ПД — лише назви полів)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                full_name: { type: string, minLength: 2, maxLength: 200 }
                position: { type: [string, "null"], maxLength: 200 }
      responses:
        "200":
          description: Оновлений профіль
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/consent:
    post:
      tags: [me]
      summary: Прийняти нову версію згоди (після зміни тексту)
      description: Після входу з'являється модальне вікно, якщо прийнята версія ≠ чинної (UC-03 AC2).
      operationId: acceptConsent
      x-roles: [ANALYST, ORG_REPRESENTATIVE, DATA_PROVIDER, ADMIN, DG_OFFICER]
      x-fr: [FR-01]
      x-uc: [UC-03]
      x-dg: [DG-10]
      x-audit: CONSENT_CHANGE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text_version]
              properties:
                text_version: { type: string, example: "1.0" }
      responses:
        "201":
          description: Новий запис згоди (записи не змінюються — лише додаються)
          content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } }
        "400":
          description: "`CONSENT_VERSION_OUTDATED`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /me/delete:
    post:
      tags: [me]
      summary: Видалити обліковий запис або відкликати згоду
      description: |
        UC-21 AC2. Користувач підтверджує паролем і підтверджує видалення даних, отриманих за **усіма**
        дозволами (завершеними й чинними, DG-12). В одній транзакції: чинні дозволи завершуються з датою
        підтвердження видалення, обліковий запис деактивується (`DEACTIVATED`); через 30 днів ПД
        анонімізуються (DG-24).
      operationId: deleteMe
      x-roles: [ANALYST, ORG_REPRESENTATIVE, DATA_PROVIDER, ADMIN, DG_OFFICER]
      x-fr: [FR-42]
      x-uc: [UC-21]
      x-dg: [DG-12, DG-24]
      x-audit: ACCOUNT_DELETE (+ CONSENT_CHANGE, якщо reason = WITHDRAW_CONSENT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, reason, confirm_data_deletion]
              properties:
                password: { type: string, format: password }
                reason: { type: string, enum: [DELETE_ACCOUNT, WITHDRAW_CONSENT] }
                confirm_data_deletion:
                  type: boolean
                  const: true
                  description: Підтверджую, що видалив дані, отримані за всіма дозволами
      responses:
        "202":
          description: Обліковий запис деактивовано; анонімізація — через 30 днів
          content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`PASSWORD_INCORRECT` (UC-21 EX1)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`PROVIDER_HAS_ACTIVE_GRANTS` — на набори постачальника є чинні дозволи (UC-21 EX2)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  # ================================================================ admin: registrations
  /admin/registrations:
    get:
      tags: [admin-registrations]
      summary: Черга заявок на реєстрацію
      operationId: listRegistrations
      x-roles: [ADMIN]
      x-fr: [FR-03]
      x-uc: [UC-02]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ReviewStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Заявки
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Registration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/registrations/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [admin-registrations]
      summary: Заявка на реєстрацію з даними заявника
      operationId: getRegistration
      x-roles: [ADMIN]
      x-fr: [FR-03, FR-04]
      x-uc: [UC-02]
      responses:
        "200":
          description: Заявка
          content: { application/json: { schema: { $ref: "#/components/schemas/Registration" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/registrations/{id}/document:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [admin-registrations]
      summary: Документ, що підтверджує працевлаштування
      description: "Відповідь з `Content-Disposition: attachment` і `X-Content-Type-Options: nosniff`."
      operationId: getRegistrationDocument
      x-roles: [ADMIN]
      x-fr: [FR-04]
      x-uc: [UC-02]
      responses:
        "200":
          description: Файл
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/registrations/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [admin-registrations]
      summary: Схвалити заявку з призначенням ролі
      description: |
        Роль: `ANALYST`, `ORG_REPRESENTATIVE` або `DATA_PROVIDER`. Для двох останніх — верифікована організація
        (FR-04). Адміністратор не може розглядати власну заявку (UC-02 EX2, D-01).
      operationId: approveRegistration
      x-roles: [ADMIN]
      x-fr: [FR-03, FR-04]
      x-uc: [UC-02]
      x-dg: [DG-07]
      x-audit: REGISTRATION_DECISION
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
