# Імпорт відкритих даних (UC-14, концепція §4.4). Секрет JOB_TOKEN — у GitHub Secrets і на Render.
# Щодня о 03:00 UTC запускаються лише конектори, чий розклад (налаштовує адміністратор, UC-20) припадає на цей день — S-37.
# Ручний запуск (Run workflow) — усі увімкнені конектори або один показник.
name: Import open data

on:
  schedule:
    - cron: "0 3 * * *" # щодня 03:00 UTC; що саме запускати — вирішує розклад кожного конектора
  workflow_dispatch:
    inputs:
      indicator:
        description: "Лише один показник (напр. GDP_USD); порожньо — усі"
        required: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Розбудити сервер (Render Free засинає після 15 хв)
        run: |
          for i in $(seq 1 12); do
            curl -fsS --max-time 30 https://gedh.vercel.app/api/health && exit 0
            sleep 10
          done
          exit 1
      - name: Запустити імпорт
        env:
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
          INDICATOR: ${{ github.event.inputs.indicator }}
        run: |
          url="https://gedh.vercel.app/api/internal/jobs/import"
          if [ -n "$INDICATOR" ]; then url="$url?indicator=$INDICATOR"
          elif [ "${{ github.event_name }}" = "schedule" ]; then url="$url?scheduled=true"; fi
          curl -fsS -X POST -H "X-Job-Token: $JOB_TOKEN" "$url"
