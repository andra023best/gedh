# Будильник щоденних задач (S-40). Розклад GitHub для нас ненадійний (затримки на години, пропуски),
# тому сервер сам «доганяє» задачі дня з першим запитом після 03:00 UTC, а цей workflow лише гарантує,
# що такий запит буде. Що саме запускати й чи вже запускалось — вирішує сервер (таблиця job_runs):
# завершення дозволів і нагадування (UC-19), строки зберігання (DG-23, DG-24), резервна копія (NFR-10),
# імпорт конекторів за їхнім розкладом (UC-14). Ручний запуск: Run workflow.
name: Daily jobs

on:
  schedule:
    - cron: "23 3 * * *" # щодня 03:23 UTC — некругла хвилина (GitHub радить уникати :00)
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Розбудити сервер (Render Free засинає після 15 хв)
        run: |
          for i in $(seq 1 12); do
            curl -fsS --max-time 30 https://gedh.vercel.app/api/health && exit 0
            sleep 10
          done
          exit 1
      - name: Запустити задачі дня, яких сервер ще не виконав
        env:
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
        run: |
          curl -fsS -X POST -H "X-Job-Token: $JOB_TOKEN" https://gedh.vercel.app/api/internal/jobs/daily
